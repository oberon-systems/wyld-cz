[project]
name = "wyld-cz"
version = "0.2.1"
description = "A custom rules sets for commitizen"
readme = "README.md"
authors = [
    { name = "zombig", email = "me@zombig.name" }
]
requires-python = ">=3.10"
dependencies = ["commitizen>=4.9,<5"]

classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.entry-points."commitizen.plugin"]
wyld_cz = "wyld_cz.base:WyldCommitizen"

[project.urls]
Repository = "https://github.com/oberon-systems/wyld-cz"
Issues = "https://github.com/oberon-systems/wyld-cz/issues"

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[build-system]
requires = ["uv_build>=0.8.13,<0.9.0"]
build-backend = "uv_build"
