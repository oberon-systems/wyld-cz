name: publish

on:
  push:
    tags:
    - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      matrix:
        python:
        - '3.10'
        - '3.12'
        - '3.14'
    steps:
    - uses: actions/checkout@v5
    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python }}
    - name: Install
      run: pip install -e . pytest
    - name: Test
      run: pytest -q

  publish:
    needs: test
    runs-on: ubuntu-24.04
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v5
    - name: Check the tag against pyproject.toml
      run: test "$GITHUB_REF_NAME" = "$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
    - uses: astral-sh/setup-uv@v6
    - name: Build
      run: uv build
    - uses: pypa/gh-action-pypi-publish@release/v1
